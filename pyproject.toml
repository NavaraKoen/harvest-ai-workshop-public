[project]
name = "harvest-ai-workshop"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "openai>=1.54.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "anthropic>=1.7.0",
]

[project.scripts]
worker = "temporal_app.worker:main"
api = "api.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm*", "config*", "temporal_app*", "api*"]
